name: safarsync
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  lucide_icons_flutter: ^1.0.0
  pdf: ^3.11.3
  printing: ^5.10.0
  intl: ^0.20.2
  flutter_vector_icons: ^2.0.0
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.3
  flutter_launcher_icons: ^0.13.1
  provider: ^6.0.5 # MVVM k liye state management
  google_fonts: ^4.0.4 # Acha font use karne ke liye
  flutter_svg: ^2.0.7 # SVG images (logo) use karne ke liye
  animate_do: ^4.2.0
  shared_preferences: ^2.5.3
  cached_network_image: ^3.4.1
  flutter_screenutil: ^5.9.0
  awesome_dialog: ^3.2.1
  animated_bottom_navigation_bar: ^1.4.0
  shimmer: ^3.0.0
  socket_io_client: ^3.1.2
  image_picker: ^1.0.4
  permission_handler: ^11.3.1
  flutter_image_compress: ^2.1.0
  http: ^1.5.0
  sqflite: ^2.4.2
  path: ^1.9.1
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0
  font_awesome_flutter: ^10.8.0
  device_preview: ^1.3.1
  url_launcher: ^6.3.1
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  flutter_local_notifications: 21.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/explore_images/fairy_meadows.jpg
    - assets/explore_images/skardu_valley.jpg
    - assets/explore_images/mohenjo_daro.jpg
    - assets/explore_images/rohtas_fort.jpg
    - assets/explore_images/food_street_lahore.jpg
    - assets/explore_images/burns_road_karachi.jpg
    - assets/explore_images/k2_base_camp.jpg
    - assets/explore_images/chitral_valley_trek.jpg

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/logo.png
  android: true
  ios: true
  web: false
  android_12:
    image: assets/images/logo.png
    color: "#ffffff"

flutter_icons:
  android: true
  ios: true
  image_path: assets/images/logo.png
