name: safarsync
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  # UI & Icons
  lucide_icons_flutter: ^1.0.0
  font_awesome_flutter: ^10.8.0 # Google + Apple sign-in icons
  cupertino_icons: ^1.0.8
  # State & Storage
  provider: ^6.0.5
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  sqflite: ^2.4.2
  path: ^1.9.1
  # Network & Caching
  http: ^1.5.0
  cached_network_image: ^3.4.1
  # Auth
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0
  # Location & Maps
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  # Utilities
  intl: ^0.20.2
  url_launcher: ^6.3.1
  share_plus: ^10.0.0
  socket_io_client: ^3.1.2
  flutter_local_notifications: 21.0.0
  # PDF export (profile trip report)
  pdf: ^3.11.3
  printing: ^5.10.0
  # Payments
  flutter_stripe: ^11.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Build-time code generators — NOT included in the release APK
  flutter_native_splash: ^2.4.3
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/explore_images/fairy_meadows.jpg
    - assets/explore_images/skardu_valley.jpg
    - assets/explore_images/mohenjo_daro.jpg
    - assets/explore_images/rohtas_fort.jpg
    - assets/explore_images/food_street_lahore.jpg
    - assets/explore_images/burns_road_karachi.jpg
    - assets/explore_images/k2_base_camp.jpg
    - assets/explore_images/chitral_valley_trek.jpg

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/logo.png
  android: true
  ios: true
  web: false
  android_12:
    image: assets/images/logo.png
    color: "#ffffff"

flutter_icons:
  android: true
  ios: true
  image_path: assets/images/logo.png
