name: safarsync
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  lucide_icons_flutter: ^3.1.25
  font_awesome_flutter: ^11.0.0
  cupertino_icons: ^1.0.8
  provider: ^6.0.5
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  sqflite: ^2.4.2
  path: ^1.9.1
  http: ^1.5.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  intl: ^0.20.2
  url_launcher: ^6.3.1
  share_plus: ^10.0.0
  socket_io_client: ^3.1.2
  flutter_local_notifications: 21.0.0
  pdf: ^3.11.3
  printing: ^5.10.0
  flutter_stripe: ^11.4.0
  # Virtual Tours — 360° panorama viewer
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.3
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/virtual_tour_player.html
    - assets/pannellum.js
    - assets/pannellum.css
    - assets/explore_images/fairy_meadows.jpg
    - assets/explore_images/skardu_valley.jpg
    - assets/explore_images/mohenjo_daro.jpg
    - assets/explore_images/rohtas_fort.jpg
    - assets/explore_images/food_street_lahore.jpg
    - assets/explore_images/burns_road_karachi.jpg
    - assets/explore_images/k2_base_camp.jpg
    - assets/explore_images/chitral_valley_trek.jpg

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/logo.png
  android: true
  ios: true
  web: false
  android_12:
    image: assets/images/logo.png
    color: "#ffffff"

flutter_icons:
  android: true
  ios: true
  image_path: assets/images/logo.png
