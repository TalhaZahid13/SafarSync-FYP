# Render Blueprint — deploys the SafarSync API as a public HTTPS service.
# Render dashboard → New → Blueprint → select this repo.
# Secrets marked `sync: false` are entered in the dashboard, never committed.
services:
  - type: web
    name: safarsync-api
    runtime: node
    rootDir: lib/backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Full service-account JSON (or its base64) from Firebase Console →
      # Project settings → Service accounts → Generate new private key.
      - key: FIREBASE_SERVICE_ACCOUNT_KEY
        sync: false
      # Hosted MySQL 8 (Aiven, Railway, TiDB Cloud, …)
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: "true"
      # Public URL of this service, e.g. https://safarsync-api.onrender.com
      - key: BACKEND_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: ADMIN_SETUP_KEY
        sync: false
      - key: OWM_API_KEY
        sync: false
