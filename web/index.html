<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="safarsync_mobileapp">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>safarsync_mobileapp</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --midnight-1: #04081A;
      --midnight-2: #0C1530;
      --midnight-3: #071828;
      --brand-gold: #FDB913;
      --brand-violet: #6C2FD9;
      --brand-emerald: #0EA676;
      --brand-teal: #1B5A6E;
      --deep-shadow: rgba(2, 5, 18, 0.65);
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: linear-gradient(145deg,
          var(--midnight-1) 0%,
          var(--midnight-2) 52%,
          var(--midnight-3) 100%);
      background-attachment: fixed;
    }

    body {
      position: relative;
      overflow-x: hidden;
      animation: base-pulse 20s ease-in-out infinite;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: -24%;
      pointer-events: none;
      z-index: 0;
      mix-blend-mode: screen;
      filter: blur(26px);
      opacity: 0.42;
    }

    body::before {
      background:
        radial-gradient(ellipse at 24% 30%, rgba(253, 185, 19, 0.30) 0%, rgba(253, 185, 19, 0.02) 54%),
        radial-gradient(ellipse at 72% 66%, rgba(14, 166, 118, 0.26) 0%, rgba(14, 166, 118, 0.00) 56%);
      animation: orb-drift-a 36s linear infinite alternate;
    }

    body::after {
      background:
        radial-gradient(ellipse at 70% 24%, rgba(108, 47, 217, 0.26) 0%, rgba(108, 47, 217, 0.00) 58%),
        radial-gradient(ellipse at 30% 74%, rgba(27, 90, 110, 0.32) 0%, rgba(27, 90, 110, 0.00) 60%);
      animation: orb-drift-b 42s linear infinite alternate;
    }

    .sparkle-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.48;
      background-image:
        radial-gradient(circle at 12% 22%, rgba(253, 185, 19, 0.95) 0.7px, transparent 1.2px),
        radial-gradient(circle at 74% 18%, rgba(255, 255, 255, 0.92) 0.7px, transparent 1.25px),
        radial-gradient(circle at 58% 76%, rgba(108, 47, 217, 0.9) 0.75px, transparent 1.25px),
        radial-gradient(circle at 28% 58%, rgba(255, 255, 255, 0.86) 0.65px, transparent 1.15px),
        radial-gradient(circle at 85% 68%, rgba(253, 185, 19, 0.88) 0.7px, transparent 1.2px),
        radial-gradient(circle at 42% 40%, rgba(108, 47, 217, 0.82) 0.65px, transparent 1.1px);
      background-size: 320px 320px, 420px 420px, 360px 360px, 280px 280px, 380px 380px, 300px 300px;
      animation: sparkle-shift 18s ease-in-out infinite alternate;
    }

    body>flt-glass-pane,
    body>flutter-view,
    body>#flt-glass-pane,
    body>#flutter-view {
      position: relative;
      z-index: 1;
    }

    .glass-card {
      background: linear-gradient(180deg, rgba(12, 21, 48, 0.52), rgba(7, 24, 40, 0.40));
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow:
        0 18px 40px var(--deep-shadow),
        inset 0 1px 0 rgba(255, 255, 255, 0.16),
        inset 0 -1px 0 rgba(4, 8, 26, 0.42);
      backdrop-filter: blur(14px) saturate(132%);
      -webkit-backdrop-filter: blur(14px) saturate(132%);
    }

    .glass-gold {
      background: linear-gradient(165deg, rgba(253, 185, 19, 0.20), rgba(12, 21, 48, 0.52));
      border: 1px solid rgba(253, 185, 19, 0.48);
      box-shadow:
        0 14px 34px rgba(253, 185, 19, 0.14),
        0 18px 40px var(--deep-shadow),
        inset 0 1px 0 rgba(255, 230, 150, 0.40);
      backdrop-filter: blur(14px) saturate(138%);
      -webkit-backdrop-filter: blur(14px) saturate(138%);
    }

    .animate-gold-glow {
      animation: animate-gold-glow 2.6s ease-in-out infinite;
      will-change: box-shadow, filter;
    }

    * {
      scrollbar-width: thin;
      scrollbar-color: var(--brand-gold) var(--midnight-2);
    }

    *::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    *::-webkit-scrollbar-track {
      background: rgba(12, 21, 48, 0.92);
      border-radius: 999px;
    }

    *::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, rgba(253, 185, 19, 0.96), rgba(234, 161, 7, 0.95));
      border-radius: 999px;
      border: 1px solid rgba(255, 220, 120, 0.56);
      box-shadow: 0 0 10px rgba(253, 185, 19, 0.35);
    }

    @keyframes base-pulse {

      0%,
      100% {
        filter: brightness(0.98) saturate(1.02);
      }

      50% {
        filter: brightness(1.06) saturate(1.08);
      }
    }

    @keyframes orb-drift-a {
      0% {
        transform: translate3d(-4%, -2%, 0) scale(1.00) rotate(0deg);
      }

      100% {
        transform: translate3d(4%, 3%, 0) scale(1.05) rotate(8deg);
      }
    }

    @keyframes orb-drift-b {
      0% {
        transform: translate3d(5%, 3%, 0) scale(1.05) rotate(6deg);
      }

      100% {
        transform: translate3d(-4%, -3%, 0) scale(1.00) rotate(-8deg);
      }
    }

    @keyframes sparkle-shift {
      0% {
        opacity: 0.36;
        transform: translate3d(0, 0, 0);
      }

      50% {
        opacity: 0.50;
      }

      100% {
        opacity: 0.40;
        transform: translate3d(-1.2%, 0.8%, 0);
      }
    }

    @keyframes animate-gold-glow {

      0%,
      100% {
        box-shadow:
          0 0 0 rgba(253, 185, 19, 0.00),
          0 0 14px rgba(253, 185, 19, 0.20),
          0 0 28px rgba(253, 185, 19, 0.12);
        filter: saturate(1.00);
      }

      50% {
        box-shadow:
          0 0 0 rgba(253, 185, 19, 0.00),
          0 0 22px rgba(253, 185, 19, 0.36),
          0 0 44px rgba(253, 185, 19, 0.22);
        filter: saturate(1.12);
      }
    }
  </style>
</head>

<body>
  <div class="sparkle-overlay" aria-hidden="true"></div>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
